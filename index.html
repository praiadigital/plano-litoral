<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Plano Litoral — planejador para comprar na praia | Praia Digital</title><meta name="description" content="Planeje a compra do seu imóvel na praia: quanto guardar por mês, por quanto tempo, com FGTS e consórcio."><link rel="canonical" href="https://praia.digital/plano-litoral/"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#0f172a;line-height:1.6}.hero{background:linear-gradient(135deg,#0c4a6e,#0ea5e9);color:#fff;padding:60px 20px;text-align:center}.container{max-width:780px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:13px;padding:24px;margin-bottom:16px;box-shadow:0 3px 10px #0001}label{display:block;font-weight:600;margin:12px 0 4px}input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;box-sizing:border-box}button{background:#0ea5e9;color:#fff;border:0;padding:14px 28px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;width:100%;margin-top:16px}.result{text-align:center;font-size:1.15rem}.big{font-size:2.2rem;font-weight:800;color:#0ea5e9}a.app{color:#0c4a6e;font-weight:600}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header class="hero"><h1>🎯 Plano Litoral</h1><p>Seu plano de voo para comprar o imóvel na praia. Quanto falta e em quanto tempo?</p></header><main class="container"><div class="card"><label>Valor do imóvel dos sonhos (R$)</label><input id="imovel" type="number" value="500000"><label>Entrada necessária (%)</label><input id="entrada" type="number" value="20"><label>Quanto você já tem (R$)</label><input id="tenho" type="number" value="50000"><label>Quanto consegue guardar por mês (R$)</label><input id="mes" type="number" value="2500"><label>Rendimento mensal da poupança/investimento (%)</label><input id="rend" type="number" value="0.7" step="0.1"><button onclick="calc()">Montar meu plano</button></div><div class="card result" id="out" style="display:none"></div><div class="card"><strong>Acelere o plano:</strong><br>🏦 <a class="app" href="https://praia.digital/simulador-credito/">Simulador de Crédito</a> — FGTS e financiamento<br>🧾 <a class="app" href="https://praia.digital/calculadora-custos/">Calculadora de Custos</a> — ITBI e cartório no plano<br>💘 <a class="app" href="https://praia.digital/match-praia/">Match Praia</a> — qual cidade combina com você</div></main><footer><a class="app" href="https://praia.digital/apps/">🌐 Apps Praia Digital</a> · <a class="app" href="https://praia.digital/">praia.digital</a></footer><script>function calc(){var im=+document.getElementById('imovel').value,e=+document.getElementById('entrada').value/100,t=+document.getElementById('tenho').value,m=+document.getElementById('mes').value,r=+document.getElementById('rend').value/100;var meta=im*e;var falta=meta-t;var meses=0,saldo=t;if(falta<=0){meses=0;}else{while(saldo<meta&&meses<600){saldo=saldo*(1+r)+m;meses++;}}var o=document.getElementById('out');o.style.display='block';if(falta<=0){o.innerHTML='<div class="big">🎉</div><p>Você já tem a entrada de <strong>R$ '+meta.toLocaleString('pt-BR')+'</strong>! Hora de simular o financiamento.</p>';}else if(meses>=600){o.innerHTML='<p>Com esse aporte mensal, a meta fica distante. Considere aumentar o aporte ou buscar imóveis de menor valor.</p>';}else{var anos=Math.floor(meses/12),resto=meses%12;o.innerHTML='<p>Meta da entrada: <strong>R$ '+meta.toLocaleString('pt-BR')+'</strong></p><p>Faltam: <strong>R$ '+falta.toLocaleString('pt-BR')+'</strong></p><div class="big">'+(anos>0?anos+' ano(s) e ':'')+resto+' mês(es)</div><p>guardando R$ '+m.toLocaleString('pt-BR')+'/mês com rendimento de '+(r*100).toFixed(1)+'% a.m.</p>';}}</script></body></html>
